# Publishes `site/` to GitHub Pages.
#
# Deliberately not Jekyll. The first attempt pointed Pages at `/docs`, which
# this repository gitignores as local working notes -- so Pages built a folder
# that does not exist on GitHub, fell back to the default theme, and died in
# its SCSS. Two static files and an upload have no such failure mode.
#
# Runs only for changes under `site/` (and by hand), so it never competes with
# the Flutter CI job.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-published; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
